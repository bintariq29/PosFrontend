<div class="container-fluid p-4 rounded-3 shadow-lg"
    style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh;">

    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h4 class="text-dark fw-bolder mb-1" style="letter-spacing: -1px;">
                <i class="pi pi-shopping-cart me-2 text-primary"></i>Purchase Management
            </h4>
            <p class="text-muted small mb-0 ms-4 ps-2">Create new purchase orders and manage stock entry</p>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-outline-dark fw-bold px-4 shadow-sm me-2 mx-2" (click)=" purchaseProducts=[]">Clear
                List</button>
            <button class="btn btn-primary fw-bold px-4 shadow-sm mx-2">Process Purchase</button>
        </div>
    </div>

    <div class="row g-4 my-4">
        <div class="col-md-4">
            <label class="form-label fw-bold text-dark text-uppercase mx-2">Suppliers</label>
            <select class="form-select shadow-sm border-2 border-dark" [(ngModel)]="selectedSupplier">
                <option [ngValue]="undefined" disabled selected>Choose Supplier</option>
                <option *ngFor="let s of suppliersList" [ngValue]="s">{{s.name}}</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold text-dark text-uppercase mx-2 ">Finance Account</label>
            <select class="form-select shadow-sm border-2 border-dark" [(ngModel)]="selectedFinanceAccount">
                <option [ngValue]="undefined" disabled selected>Select Account</option>
                <option *ngFor="let a of financeAccountList" [ngValue]="a">{{a.accountName}}</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold text-dark text-uppercase  mx-2">Product</label>
            <select class="form-select shadow-sm border-2 border-dark" [(ngModel)]="selectedProduct"
                (change)="onProductSelect()">
                <option [ngValue]="undefined" disabled selected>Select Product</option>
                <option *ngFor="let p of productList" [ngValue]="p">{{p.name}}</option>
            </select>
        </div>
    </div>


    <div class="row g-4">
        <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let item of purchaseProducts; let i = index">
            <div class="card h-100 shadow-sm rounded-4 overflow-hidden border-2 border-dark">

                <div class="position-relative bg-light" style="min-height: 200px;">
                    <div class="d-flex justify-content-center align-items-center h-100 position-absolute w-100">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status"></div>
                            <div class="mt-2 small text-muted">Loading...</div>
                        </div>
                    </div>
                    <img [src]="getImageUrl({id: item.productId})" class="card-img-top d-none object-fit-cover"
                        style="height: 200px;" alt="{{item.productName}}"
                        onload="this.classList.remove('d-none'); this.previousElementSibling.remove();"
                        onerror="this.classList.remove('d-none'); this.previousElementSibling.remove(); this.src='/assets/no-image.png';">
                </div>

                <div class="card-body d-flex flex-column bg-white">
                    <h5 class="card-title fw-bold mb-1 text-truncate" title="{{item.productName}}">{{item.productName}}
                    </h5>
                    <p class="mb-2 small text-muted font-monospace">ID: #{{item.productId}}</p>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="small fw-bold">Qty</label>
                            <input type="number" class="form-control form-control-sm border-2 border-dark"
                                [(ngModel)]="item.quantity" (change)="updateRowTotal(item)">
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold">Batch</label>
                            <input type="number" class="form-control form-control-sm border-2 border-dark"
                                [(ngModel)]="item.batchNo">
                        </div>
                    </div>

                    <div class="mt-auto border-top pt-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="small text-muted">Total:</span>
                            <span class="fw-bold text-success fs-5">${{item.totalPrice | number:'1.2-2'}}</span>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-light border-0 d-flex gap-2 pt-0">
                    <button class="btn btn-sm btn-outline-danger w-100 mb-2 fw-bold" (click)="removeItem(i)">
                        <i class="pi pi-trash me-1"></i> Remove
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed-bottom p-4 d-flex justify-content-end pointer-events-none" *ngIf="purchaseProducts.length > 0">
        <div class="card border-2 border-dark shadow-lg bg-white p-3 shadow" style="min-width: 250px;">
            <div class="text-center">
                <div class="small fw-bold text-uppercase text-muted">Grand Total</div>
                <div class="h3 fw-bolder text-primary mb-0">${{calculateGrandTotal() | number:'1.2-2'}}</div>
            </div>
        </div>
    </div>
</div>
