<div class="container-fluid p-4 rounded-3 shadow-lg"
    style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
    <div class="col-md-6">
        <h4 class="text-dark fw-bolder mb-2" style="letter-spacing: -1px;">
            <i class="pi pi-box me-2 text-primary"></i>Product Management
        </h4>
    </div>
    <div class="row g-3 mb-4 align-items-center">
        <div class="col-auto">
            <input type="text" class="form-control shadow-sm border-2 border-dark" style="width: 320px;"
                [(ngModel)]="keyword" placeholder="Search products..." (keydown.enter)="onSearch()" />
        </div>
        <div class="col-auto d-flex gap-3">
            <button class="btn btn-outline-dark fw-bold px-4 shadow-sm mx-2" (click)="onSearch()">Search</button>
            <button class="btn btn-outline-primary fw-bold px-4 shadow-sm mx-2" (click)="createProduct()">Create
            </button>
        </div>
    </div>

    <div class="bg-transparent">
        <p-dataView #dv [value]="products" [paginator]="true" [rows]="10" [totalRecords]="totalItems" [lazy]="true"
            (onLazyLoad)="getDataPage($event)" [showCurrentPageReport]="true"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} products" layout="grid">

            <ng-template let-product pTemplate="gridItem">
                <div class="col-12 md:col-6 lg:col-4 xl:col-3 p-2">
                    <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden product-card">
                        <!-- Image Section -->
                        <div class="position-relative text-center bg-light" style="height: 200px; overflow: hidden;">
                            <img *ngIf="product.image" [src]="'data:image/png;base64,' + product.image"
                                [alt]="product.sku" class="w-100 h-100" style="object-fit: cover;">
                            <div *ngIf="!product.image"
                                class="d-flex align-items-center justify-content-center h-100 text-muted">
                                <i class="pi pi-image" style="font-size: 3rem;"></i>
                            </div>
                            <!-- Status Badge -->
                            <span class="position-absolute top-0 end-0 m-2 badge"
                                [ngClass]="product.isActive ? 'bg-success' : 'bg-danger'">
                                {{product.isActive ? 'Active' : 'Inactive'}}
                            </span>
                        </div>

                        <!-- Content Section -->
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title fw-bold text-dark mb-0 text-truncate"
                                    [title]="product.name || product.sku">
                                    {{product.name || product.sku}}</h5>
                                <span class="h5 text-primary fw-bolder mb-0">${{product.price | number:'1.2-2'}}</span>
                            </div>

                            <p class="card-text text-muted small mb-3 flex-grow-1" style="min-height: 40px;">
                                {{product.description || 'No description available.'}}
                            </p>

                            <div class="d-flex justify-content-between align-items-center mt-3 border-top pt-3">
                                <div class="btn-group w-100">
                                    <button class="btn btn-outline-primary btn-sm fw-bold w-50"
                                        (click)="editProduct(product)">
                                        <i class="pi pi-pencil me-1"></i> Edit
                                    </button>
                                    <button class="btn btn-outline-danger btn-sm fw-bold w-50"
                                        (click)="delete(product)">
                                        <i class="pi pi-trash me-1"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Footer Section (optional metadata) -->
                        <div class="card-footer bg-white border-0 text-muted small py-2 d-flex justify-content-between">
                            <span><i class="pi pi-tag me-1"></i>{{product.categoryId}}</span>
                            <span><i class="pi pi-briefcase me-1"></i>{{product.brandId}}</span>
                        </div>

                    </div>
                </div>
            </ng-template>
        </p-dataView>
    </div>
</div>

<style>
    .product-card {
        transition: transform 0.2s ease-in-out, box-shadow 0.2s;
    }

    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    }
</style>
