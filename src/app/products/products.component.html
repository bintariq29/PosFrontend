<div class="container-fluid p-4 rounded-3 shadow-lg"
    style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
    <div class="col-md-6">
        <h4 class="text-dark fw-bolder mb-2" style="letter-spacing: -1px;">
            <i class="pi pi-box me-2 text-primary"></i>Product Management
        </h4>
    </div>
    <div class="row g-3 mb-4 align-items-center">
        <div class="col-auto">
            <input type="text" class="form-control shadow-sm border-2 border-dark" style="width: 320px;"
                [(ngModel)]="keyword" placeholder="Search products..." (keydown.enter)="onSearch()" />
        </div>
        <div class="col-auto d-flex gap-3">
            <button class="btn btn-outline-dark fw-bold px-4 shadow-sm mx-2" (click)="onSearch()">Search</button>
            <button class="btn btn-outline-primary fw-bold px-4 shadow-sm mx-2" (click)="createProduct()">Create
            </button>
        </div>
    </div>


    <div class="row g-4">
        <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let product of products">
            <div class="card h-100 shadow-sm rounded-4 overflow-hidden">

                <div class="position-relative bg-light" style="min-height: 200px;">
                    <div class="d-flex justify-content-center align-items-center h-100 position-absolute w-100">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status"></div>
                            <div class="mt-2 small text-muted">Loading...</div>
                        </div>
                    </div>

                    <img src="https://localhost:44311/api/services/app/Image/GetImageById?id={{product.id}}"
                        class="card-img-top d-none object-fit-cover" alt="{{product.id}}"
                        onload="this.classList.remove('d-none'); this.previousElementSibling.remove();"
                        onerror="this.classList.remove('d-none'); this.previousElementSibling.remove(); this.src='/assets/no-image.png';">
                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" title="{{product.name}}">{{product.name}}</h5>
                    <p class="mb-1 small text-muted"><span class="fw-bold">SKU:</span> {{product.sku}}</p>
                    <p class="mb-1 fw-bold text-success">${{product.price}}</p>
                    <p class="mb-2 small text-truncate" title="{{product.description}}">
                        {{product.description}}
                    </p>
                    <div class="mt-auto d-flex flex-wrap gap-1">
                        <span class="badge {{product.isActive ? 'bg-success' : 'bg-secondary'}} mx-2">
                            {{product.isActive ? 'Active' : 'Inactive'}}
                        </span>
                        <span
                            class="badge {{product.isPerishable ? 'bg-warning text-dark' : 'bg-info text-dark'}} mx-2">
                            {{product.isPerishable ? 'Perishable' : 'Non-Perishable'}}
                        </span>
                    </div>
                </div>

                <div class="card-footer bg-white border-0 d-flex gap-2 pt-2">
                    <button class="btn btn-sm btn-outline-primary w-50 mx-2">Edit</button>
                    <button class="btn btn-sm btn-outline-danger w-50 mx-2">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>
