<form class="form-horizontal" autocomplete="off" #editProductForm="ngForm" (ngSubmit)="save()">
    <div class="modal-header">
        <h4 class="modal-title">
            <span>Edit Product</span>
        </h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="bsModalRef.hide()"></button>
    </div>
    <div class="modal-body">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">SKU *</label>
                <input type="text" class="form-control" name="sku" [(ngModel)]="product.sku" required maxlength="64">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Price *</label>
                <input type="number" class="form-control" name="price" [(ngModel)]="product.price" required min="0">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Brand *</label>
                <select class="form-select" name="brandId" [(ngModel)]="product.brandId" required>
                    <option *ngFor="let brand of brands" [ngValue]="brand.id">{{brand.name}}</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Category *</label>
                <select class="form-select" name="categoryId" [(ngModel)]="product.categoryId" required>
                    <option *ngFor="let category of categories" [ngValue]="category.id">{{category.name}}</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Description</label>
            <textarea class="form-control" name="description" [(ngModel)]="product.description" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Product Image</label>
            <div *ngIf="product.image" class="mb-2">
                <img [src]="'data:image/png;base64,' + product.image" alt="Product Image" style="max-height: 100px;"
                    class="img-thumbnail">
            </div>
            <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*">
            <small class="text-muted">Upload new image to replace existing.</small>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="isActive" id="isActive"
                        [(ngModel)]="product.isActive">
                    <label class="form-check-label" for="isActive">
                        Is Active
                    </label>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="isPerishable" id="isPerishable"
                        [(ngModel)]="product.isPerishable">
                    <label class="form-check-label" for="isPerishable">
                        Is Perishable
                    </label>
                </div>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" (click)="bsModalRef.hide()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!editProductForm.form.valid || saving">Save</button>
    </div>
</form>
